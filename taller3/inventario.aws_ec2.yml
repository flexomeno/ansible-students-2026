plugin: amazon.aws.aws_ec2
filters:
  "tag:Name": ["app*"]
regions:
  - us-east-1
hostnames:
  - instance-id
compose:
  ansible_connection: "'amazon.aws.aws_ssm'"
  ansible_aws_ssm_bucket_name: "'ansible-ssm-transfer-314567760063'"
  ansible_aws_ssm_region: "'us-east-1'"
  ansible_user: "'ssm-user'"
keyed_groups:
  - key: tags.Application
    separator: ''
