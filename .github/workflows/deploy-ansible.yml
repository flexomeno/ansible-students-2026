name: Deploy with Ansible via AWS OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write # Requerido para autenticación OIDC
  contents: read  # Requerido para checkout del código

jobs:
  ansible-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Debug OIDC Token Claim
        run: |
          echo "Ref actual: ${{ github.ref }}"
          echo "Evento actual: ${{ github.event_name }}"
          echo "Repo actual: ${{ github.repository }}"

      - name: Configurar credenciales de AWS vía OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::314567760063:role/GitHubActionsAnsibleRole
          aws-region: us-east-1

      - name: Instalar Python y Ansible
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de Ansible y AWS SDK
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws --force

      - name: Instalar Session Manager Plugin
        run: |
          curl -fsSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version
  
      - name: Retrieve Vault password from AWS Secrets Manager
        run: |
          ansible-playbook retrieve_vault_password.yml

      - name: Ejecutar Playbook de Ansible
        working-directory: taller4
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          ansible-inventory -i inventario.aws_ec2.yml --graph
          ansible-playbook -i inventario.aws_ec2.yml site.yml --vault-password-file vault_pass.txt
